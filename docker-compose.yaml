name: highload-hw1

x-app: &app
  image: highload-hw1-app:local
  init: true
  restart: unless-stopped
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - "fetch('http://127.0.0.1:8080/health', {signal: AbortSignal.timeout(2000)}).then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
    interval: 5s
    timeout: 3s
    retries: 12
    start_period: 5s

services:
  app-1:
    <<: *app
    build:
      context: .
    pull_policy: build
    environment:
      PORT: "8080"
      POD_ID: pod-1
      DATACENTER: dc-1
    ports:
      - "127.0.0.1:8081:8080"

  app-2:
    <<: *app
    pull_policy: never
    environment:
      PORT: "8080"
      POD_ID: pod-2
      DATACENTER: dc-2
    ports:
      - "127.0.0.1:8082:8080"

  prometheus:
    image: prom/prometheus:v3.5.0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2d
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "127.0.0.1:9090:9090"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.2.0
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env before starting}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/api/health"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  dashboard-generator:
    image: highload-hw1-app:local
    pull_policy: never
    init: true
    restart: "no"
    command: ["node", "dist/dashboard/cli.js"]
    environment:
      APP_URL: http://app-1:8080
      GRAFANA_URL: http://grafana:3000
      GRAFANA_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GRAFANA_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Copy .env.example to .env before starting}
      DASHBOARD_UID: items-service-overview
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      grafana:
        condition: service_healthy

  load-generator:
    image: highload-hw1-app:local
    pull_policy: never
    init: true
    restart: unless-stopped
    stop_grace_period: 10s
    command: ["node", "dist/load/cli.js"]
    environment:
      LOAD_TARGETS: http://app-1:8080,http://app-2:8080
      LOAD_START_RPS: "2"
      LOAD_TARGET_RPS: "30"
      LOAD_RAMP_SECONDS: "120"
      LOAD_POOL_SIZE: "256"
      LOAD_MAX_IN_FLIGHT: "100"
      LOAD_REQUEST_TIMEOUT_MS: "2000"
      LOAD_SHUTDOWN_GRACE_MS: "3000"
      LOAD_LOG_INTERVAL_SECONDS: "10"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    depends_on:
      app-1:
        condition: service_healthy
      app-2:
        condition: service_healthy
      dashboard-generator:
        condition: service_completed_successfully

volumes:
  prometheus-data:
  grafana-data:
